name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        workspace: ['@ittek/backend', '@ittek/frontend']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace ${{ matrix.workspace }} --if-present

      - name: Lint
        run: npm run lint --workspace ${{ matrix.workspace }} --if-present

      - name: Test
        run: npm run test --workspace ${{ matrix.workspace }} --if-present

      - name: Build
        run: npm run build --workspace ${{ matrix.workspace }} --if-present
