# Render Blueprint — deploys iTtEk POS as a SINGLE web service.
# The service builds the frontend + backend and serves both from one Node
# process. Provide a MongoDB connection string (e.g. MongoDB Atlas) as
# MONGODB_URI in the Render dashboard; the JWT secrets are auto-generated.
services:
  - type: web
    name: ittek-pos
    runtime: node
    plan: free
    # --include=dev is required: Render sets NODE_ENV=production, which would
    # otherwise skip the build tools (typescript, tailwind, etc.).
    buildCommand: npm install --include=dev && npm run build:unified
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # First super admin — created automatically on first boot if absent.
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_NAME
        value: Super Admin
      # Optional — set to enable product/business image uploads.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional — set APP_URL to your Render URL and SMTP_* to enable
      # password-reset emails.
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
